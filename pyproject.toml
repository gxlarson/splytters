[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splytters"
version = "0.2.0"
description = "Embedding-based train/test splitting beyond random splits: adversarial, overlap, and distribution-balanced splits for robust model evaluation."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Stefan Larson" },
]
requires-python = ">=3.10"
keywords = [
    "train-test-split",
    "adversarial-splits",
    "dataset-partitioning",
    "model-evaluation",
    "robustness",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core: the splitters/ package (embedding-based splitting algorithms)
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
# Modality-specific sorters
text = [
    "pysbd",
    "torch",
    "transformers",
    "wordfreq",
    "py-readability-metrics",
]
image = ["pillow"]
audio = ["librosa"]
tabular = ["pandas"]
# Embedding models (TextEmbedder, CLIP, OpenAI)
embedders = [
    "sentence-transformers",
    "transformers",
    "openai",
]
viz = ["matplotlib"]
# Approximate-nearest-neighbor backend for large-n splits (scalability)
ann = ["pynndescent"]
# Demo scripts (demos/demo.py, demos/im_demo.py, demos/visualize_splits.py)
demo = [
    "sentence-transformers",
    "datasets",
    "matplotlib",
    "umap-learn",
]
# Documentation site (Material for MkDocs + docstring-driven API reference)
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]
all = ["splytters[text,image,audio,tabular,embedders,viz,demo,ann]"]
dev = [
    "splytters[all,docs]",
    "networkx",  # exact min-cut backend for min_cut_split(method="stoer_wagner")
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/gxlarson/splytters"
Repository = "https://github.com/gxlarson/splytters"
Issues = "https://github.com/gxlarson/splytters/issues"

[tool.setuptools]
# Single top-level namespace: `splytters` and its `splytters.sorters` subpackage.
packages = ["splytters", "splytters.sorters"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so the package's type hints reach downstream
# type checkers (mypy/pyright). One marker at the package root covers
# splytters and its subpackages.
splytters = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
branch = true
source = ["splytters"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E741: single-char names like `l` are used in a few tight numeric loops.
ignore = ["E741"]
