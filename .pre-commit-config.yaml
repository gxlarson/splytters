# Local git hooks, managed by the pre-commit framework.
#
# Activate once per clone:
#   pip install pre-commit
#   pre-commit install
#
# CI runs the same checks (see .github/workflows/ci.yml), so hooks are a fast
# local early warning, not the only line of defense.
repos:
  # Secret scanning on staged changes, before anything enters history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lint only (no formatter), matching the CI `lint` job. Config lives in
  # [tool.ruff] in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
