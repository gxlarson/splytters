name: docs

# Read the Docs hosts the published site (splytters.readthedocs.io). This
# workflow only validates that the docs build cleanly — it does not deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # mkdocstrings imports the package to read docstrings, so install it
      # (core deps only) alongside the docs toolchain.
      - name: Install docs deps
        run: pip install -e ".[docs]"
      - name: Build (strict — fail on warnings/broken refs)
        run: mkdocs build --strict
