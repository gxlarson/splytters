name: CodeQL

# Static security analysis for the Python source. Runs on pushes to main, on
# pull requests, and weekly so newly disclosed query patterns catch existing
# code even when nothing changes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    # Scoped to this job: CodeQL needs to upload findings to the Security tab.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
