name: Publish to PyPI

# Builds the sdist + wheel and uploads them to PyPI when a GitHub Release is
# published. Authentication uses PyPI Trusted Publishing (OIDC) — no API token
# or stored secret. Configure the trusted publisher on PyPI once (see below).
on:
  release:
    types: [published]

# Least privilege by default; the publish job widens id-token for OIDC below.
permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/splytters
    permissions:
      id-token: write   # required for OIDC / Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distributions render and validate
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Verify the wheel installs and imports in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import splytters; splytters.list_splitters(); import splytters.sorters; print('install ok')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
